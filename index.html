<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ahmed Design: Desarrollador web profesional al antojo del cliente.">
    <title>Ahmed Design | Motivarse</title>
    <link rel="stylesheet" href="estilos.css" />
    <link rel="stylesheet" href="responsive.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        @media (max-width: 768px) {
            img {
                max-width: 100% !important;
                height: auto !important;
                object-fit: cover;
            }
        }
    </style>
</head>

<body>

    <!-- Barra de navegación superior -->
    <header class="navbar">
        <div class="logo">Soluciones Digitales Ahmed</div>
        <nav class="nav-links">
            <a href="index.html" class="link active">Accueil</a>
            <a href="#services" class="link">Services</a>
            <a href="#projets" class="link">Projets</a>
            <a href="#contacto" class="btn-nav">Contact</a>
        </nav>
    </header>

    <!-- Cuadrícula principal de 4 esquinas -->
    <main class="grid-4-corners">

        <!-- ESQUINA 1: Superior Izquierda (Scroll Horizontal) -->
        <section class="corner" id="corner-1" data-direction="horizontal" data-interval="3200">
            <div class="slides-track">
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80');">
                </div>
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1000&q=80');">
                </div>
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=1000&q=80');">
                </div>
            </div>
            <span class="corner-badge">Optimisation Mobile</span>
            <div class="dots"></div>
        </section>

        <!-- ESQUINA 2: Superior Derecha (Scroll Vertical) -->
        <section class="corner" id="corner-2" data-direction="vertical" data-interval="3800">
            <div class="slides-track">
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1000&q=80');">
                </div>
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=1000&q=80');">
                </div>
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1504639725590-34d0984388bd?auto=format&fit=crop&w=1000&q=80');">
                </div>
            </div>
            <span class="corner-badge">Développement Web</span>
            <div class="dots"></div>
        </section>

        <!-- ESQUINA 3: Inferior Izquierda (Scroll Vertical) -->
        <section class="corner" id="corner-3" data-direction="vertical" data-interval="4100">
            <div class="slides-track">
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=1000&q=80');">
                </div>
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1000&q=80');">
                </div>
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1000&q=80');">
                </div>
            </div>
            <span class="corner-badge">Développement Web</span>
            <div class="dots"></div>
        </section>

        <!-- ESQUINA 4: Inferior Derecha (Scroll Horizontal) -->
        <section class="corner" id="corner-4" data-direction="horizontal" data-interval="3500">
            <div class="slides-track">
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1531297484001-80022131f5a1?auto=format&fit=crop&w=1000&q=80');">
                </div>
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1000&q=80');">
                </div>
                <div class="slide"
                    style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1000&q=80');">
                </div>
            </div>
            <span class="corner-badge">Logiciels et Office</span>
            <div class="dots"></div>
        </section>

        <!-- Tarjeta Central Flotante -->
        <!-- 
        <div class="center-card">
            <h1>Soluciones Digitales Ahmed</h1>
            <p>Nous résolvons les problèmes que d'autres se contentent de formater. Logiciel, web et support numérique
                sur mesure.</p>
            <div class="card-actions">
                <a href="#contacto" class="btn-primary">Prendre Rendez-vous</a>
                <button id="toggle-play" class="btn-secondary">Mettre en pause</button>
            </div>
        </div>-->

    </main>

    <script src="script.js"></script>
</body>

</html>
